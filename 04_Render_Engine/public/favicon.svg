<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rumble Bunny">
  <title>Rumble Bunny</title>
  <!-- Asphalt tile -->
  <rect width="64" height="64" rx="13" fill="#1a1512"/>
  <!-- Speed streaks, hottest at the top -->
  <rect x="5" y="17" width="22" height="6" rx="3" fill="#ffb400"/>
  <rect x="5" y="29" width="16" height="6" rx="3" fill="#ff6a00"/>
  <rect x="5" y="41" width="10" height="6" rx="3" fill="#d81f14"/>
  <!-- Checkered flag, raked forward -->
  <g transform="translate(29 10) skewX(-10)">
    <rect x="0" y="0" width="30" height="44" rx="2" fill="#fff5e6"/>
    <g fill="#1a1512">
      <rect x="0"  y="0"  width="10" height="11"/>
      <rect x="20" y="0"  width="10" height="11"/>
      <rect x="10" y="11" width="10" height="11"/>
      <rect x="0"  y="22" width="10" height="11"/>
      <rect x="20" y="22" width="10" height="11"/>
      <rect x="10" y="33" width="10" height="11"/>
    </g>
  </g>
</svg>
